# 01-bot-protection.conf
# Anti-Bot, Anti-Crawler and Exploit Scanning Defense

# 1. Map User-Agents to identify malicious scanners and search crawlers
map $http_user_agent $is_bad_bot {
    default 0;
    
    # Port & Vulnerability Scanners / Reconnaissance Tools
    "~*shodan"          1;
    "~*censys"          1;
    "~*zoomeye"         1;
    "~*binaryedge"      1;
    "~*masscan"         1;
    "~*nmap"            1;
    "~*zgrab"           1;
    "~*nikto"           1;
    "~*sqlmap"          1;
    "~*openvas"         1;
    "~*acunetix"        1;
    "~*nessus"          1;
    "~*nuclei"          1;
    "~*dirbuster"       1;
    "~*gobuster"        1;
    "~*wfuzz"           1;

    # Automated script libraries often used for scanning
    "~*python-requests" 1;
    "~*aiohttp"         1;
    "~*httpx"           1;
    "~*go-http-client"  1;
    "~*libwww-perl"     1;

    # Search engine bots and crawlers (to hide the proxy camouflage site)
    "~*yandex"          1;
    "~*googlebot"       1;
    "~*bingbot"         1;
    "~*baiduspider"     1;
    "~*mail\.ru"        1;
    "~*ahrefs"          1;
    "~*semrush"         1;
    "~*dotbot"          1;
    "~*mj12bot"         1;
}

# 2. Connection upgrade mapping for WebSockets
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 3. Connection upgrade mapping for Telemt
map $http_upgrade $telemt_connection_upgrade {
    default upgrade;
    ''      '';
}

# 4. Rate limiting zone for cover site
limit_req_zone $binary_remote_addr zone=cover_limit:10m rate=15r/s;
